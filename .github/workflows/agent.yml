name: Trading agent

# CONFIRMED live 2026-08-27: a single "0 13 * * 1-5" trigger was delayed by
# GitHub's own scheduler from 13:00 UTC to 22:39 UTC (9.5 hours) -- by the
# time it ran, main.ts's exitIfPastClose() correctly no-op'd since the
# 3:30pm ET close had long passed, so the whole day was silently missed.
# GitHub's own docs warn that scheduled workflows can be delayed, and that
# the top of the hour is a known high-load time to avoid -- our trigger hit
# exactly that. Fixed with two changes:
#   1. Off-the-hour minutes (:17/:47), not :00.
#   2. Three redundant slots across the pre-market/early-session window
#      instead of one -- if any single trigger is delayed or dropped,
#      another is likely to land close to the real 9:30am ET open. Safe
#      only because of the concurrency block below: a second trigger that
#      fires while a session is already running QUEUES instead of starting
#      a parallel session (which would double-trade the same sandbox
#      account) -- it just runs later, sees exitIfPastClose() is true by
#      then, and no-ops.
# main.ts's own waitForMarketOpen() (DST-safe, reads real America/New_York
# time) is what actually aligns the start to 9:30am ET regardless of
# season -- see CLAUDE.md's Remote hosting section.
#
# CONFIRMED live 2026-08-28: the three-slot fix above was NOT enough --
# all three schedule slots fired ~9-9.5 hours late together, proving
# GitHub was deprioritizing this repo's scheduled workflows generally, not
# just congesting one minute. workflow_dispatch is NOT subject to this
# delay (confirmed: starts within seconds). PRIMARY trigger is now an
# external cron-job.org job POSTing to this workflow's dispatches endpoint
# on a schedule -- these schedule: slots stay only as a harmless backup
# (the concurrency block below makes a redundant/late fire a no-op via
# exitIfPastClose()). See CLAUDE.md's Remote hosting section for the full
# cron-job.org setup.
on:
  schedule:
    - cron: "17 13 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "17 14 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: trading-agent-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    # CONFIRMED live 2026-08-31: the original "350 min fits under the 360
    # hard cap" math was wrong — it didn't account for the pre-open wait.
    # A 9:15am ET trigger + 9:30am-3:25pm ET session + checkout/npm-ci/
    # commit overhead added up to ~370 min, so GitHub force-killed the job
    # at the 350-min timeout, 20 min before its own EOD close ever ran (see
    # CLAUDE.md's Remote hosting section). Fixed with two changes: the EOD
    # close moved from 3:25pm to 3:15pm ET (main.ts), shaving 10 min off
    # the session, and the external cron-job.org trigger should fire right
    # at 9:29am ET (not 9:15am) to cut the pre-open wait to ~1 min instead
    # of 15. With both fixes the real requirement is ~349 min; this is set
    # a bit above that as our own buffer, still comfortably under 360.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run trading agent
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_BASE_URL: ${{ secrets.WEBULL_BASE_URL }}
          WEBULL_SANDBOX_ACCOUNT_ID: ${{ secrets.WEBULL_SANDBOX_ACCOUNT_ID }}
        run: npx tsx main.ts

      # Runs even if the agent step failed/timed out, so a partial day's
      # trades.jsonl/watchlist.json still get saved instead of lost with
      # the ephemeral runner filesystem.
      #
      # CONFIRMED live multiple times (2026-09-01/09-08, 2026-10-09,
      # 2026-11-03) that a plain `git pull --rebase` here can hit a real
      # content conflict against another concurrent run's already-pushed
      # commit (same three files, both sides appended/regenerated
      # different content) — the job used to just error out on that,
      # silently discarding this run's own trades.jsonl line(s). 2026-10-09
      # lost a real +$96 filled trade this way; 2026-11-03 only lost a
      # log-only missed_entry, but it's the same gap. Fixed 2026-11-03:
      #   - .gitattributes declares trades.jsonl/daily-notes.jsonl as
      #     merge=union (pure append-only logs — the only correct merge is
      #     "keep every line from both sides") and watchlist.json as
      #     merge=ours (fully regenerated every run, never appended to, so
      #     there's nothing to reconcile — just keep whichever copy is
      #     already on the branch being rebased onto).
      #   - merge.ours.driver must be registered locally every run — a
      #     .gitattributes merge= name only refers to a driver, it doesn't
      #     define one. "true" is git's own documented built-in no-op
      #     driver for exactly this (see gitattributes(5)'s merge=ours
      #     example).
      #   - A short retry loop around pull+push, for the SEPARATE (much
      #     more common) failure mode these merge drivers don't address:
      #     origin moving again between this attempt's rebase and its own
      #     push. Content conflicts in these three files should now
      #     auto-resolve via the drivers above with no retry needed at all.
      - name: Commit trade log + watchlist
        if: always()
        run: |
          git config user.name "webull-agent"
          git config user.email "actions@users.noreply.github.com"
          git config merge.ours.driver true
          git add trades.jsonl watchlist.json daily-notes.jsonl
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "agent run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::failed to push trade log after 5 attempts -- data only exists in this ephemeral runner's workspace, check the run log"
          exit 1
